<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Patch A Mumma title card</title>
<!-- Rendered to PNG by demo/postprocess.ts. Same type and palette as the site. -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,300..900;1,62..125,300..900&display=block" rel="stylesheet" />
<style>
  :root {
    --paper: #FAF9F4; --ink: #10291C; --ink-soft: #3E5546; --rust: #B23C1C;
    --humus: #3A2518; --humus-dark: #2A1A10; --clay: #C08A3E; --clay-dark: #9C6A2A; --chalk: #ECE6D7;
    --leaf-900: #173D1F; --leaf-500: #4E8E35; --leaf-300: #8DBF5A;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--paper); }
  body { font-family: Archivo, system-ui, sans-serif; color: var(--ink); position: relative; }

  .copy { position: absolute; left: 7.5vw; right: 7.5vw; top: 13vh; }
  .kicker { display: flex; align-items: center; gap: .55em; font-stretch: 72%; font-weight: 750;
    font-size: 1.55vw; letter-spacing: .06em; text-transform: uppercase; color: var(--rust); }
  .kicker svg { width: 2.6em; height: 2.6em; }
  h1 { margin-top: 2.2vh; font-stretch: 62.5%; font-weight: 850; text-transform: uppercase;
    letter-spacing: -0.01em; line-height: .86; font-size: 12.4vw; color: var(--ink); }
  p { margin-top: 3.4vh; max-width: 34ch; font-size: 2.05vw; line-height: 1.32; color: var(--ink-soft); font-weight: 450; }

  .ground { position: absolute; left: 0; right: 0; bottom: 0; height: 27vh; }
  .ground svg.strata { position: absolute; inset: 0; width: 100%; height: 100%; }
  .sprouts { position: absolute; left: 0; right: 0; top: 7%; height: 0; }
  .sprouts svg { position: absolute; bottom: -.35vh; width: 3.4vw; height: 3.4vw; transform-origin: 50% 100%; }
  .chip { position: absolute; right: 3vw; padding: .2em .55em; font-size: .78vw; font-weight: 600;
    letter-spacing: .02em; font-stretch: 85%; }
  .chip.dark { background: var(--humus-dark); color: #E9DFC9; }
  .chip.light { background: var(--paper); color: var(--ink-soft); }

  @media (orientation: portrait) {
    .copy { left: 7vw; right: 7vw; top: 15vh; }
    .kicker { font-size: 3.8vw; }
    h1 { font-size: 25vw; margin-top: 2.6vh; }
    p { font-size: 5.6vw; margin-top: 3vh; }
    .ground { height: 24vh; }
    .sprouts svg { width: 9vw; height: 9vw; }
    .chip { font-size: 2.8vw; right: 5vw; }
  }
</style>
</head>
<body>
  <div class="copy">
    <div class="kicker">
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <path d="M3 25.5h26" stroke="#173D1F" stroke-width="1.8" stroke-linecap="round" />
        <path d="M16 25V14" stroke="#173D1F" stroke-width="1.8" stroke-linecap="round" />
        <path d="M16 16c-1-5-5.5-7.5-10-7 .3 4.6 4.4 7.6 10 7z" fill="#2F6B2A" stroke="#173D1F" stroke-width="1.4" stroke-linejoin="round" />
        <path d="M16 14.5c.6-5.4 5-8.6 10.5-8.3-.2 5.2-4.6 8.6-10.5 8.3z" fill="#8DBF5A" stroke="#173D1F" stroke-width="1.4" stroke-linejoin="round" />
        <ellipse cx="16" cy="28.4" rx="3.1" ry="1.9" fill="#E9B160" stroke="#173D1F" stroke-width="1.2" />
      </svg>
      Site walkthrough
    </div>
    <h1>Patch A Mumma</h1>
    <p>A hand-drawn, animated site for an Essex food-garden service, from bare ground to a full pantry.</p>
  </div>

  <div class="ground">
    <svg class="strata" viewBox="0 0 1440 300" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <pattern id="crumb" width="22" height="18" patternUnits="userSpaceOnUse">
          <circle cx="4" cy="5" r="1.3" fill="#4B3223" /><circle cx="15" cy="12" r="1" fill="#55392A" />
          <circle cx="11" cy="3" r=".8" fill="#2A1A10" />
        </pattern>
        <pattern id="grit" width="26" height="16" patternUnits="userSpaceOnUse">
          <circle cx="6" cy="6" r="1.1" fill="#D6A55F" /><circle cx="19" cy="11" r=".9" fill="#9C6A2A" />
        </pattern>
        <pattern id="flint" width="60" height="30" patternUnits="userSpaceOnUse">
          <path d="M10 14l5-3 6 2-3 5-6 0z" fill="#D8D0BC" /><circle cx="44" cy="20" r="1.2" fill="#D8D0BC" />
        </pattern>
      </defs>
      <!-- topsoil -->
      <path d="M0 22 Q60 16 120 21 T240 19 T360 23 T480 18 T600 22 T720 20 T840 24 T960 19 T1080 22 T1200 18 T1320 23 T1440 20 V300 H0Z" fill="#3A2518" />
      <path d="M0 22 Q60 16 120 21 T240 19 T360 23 T480 18 T600 22 T720 20 T840 24 T960 19 T1080 22 T1200 18 T1320 23 T1440 20 V300 H0Z" fill="url(#crumb)" />
      <path d="M0 22 Q60 16 120 21 T240 19 T360 23 T480 18 T600 22 T720 20 T840 24 T960 19 T1080 22 T1200 18 T1320 23 T1440 20" fill="none" stroke="#173D1F" stroke-width="2.5" vector-effect="non-scaling-stroke" />
      <!-- clay -->
      <path d="M0 150 Q90 140 180 148 T360 145 T540 152 T720 143 T900 150 T1080 146 T1260 153 T1440 147 V300 H0Z" fill="#C08A3E" />
      <path d="M0 150 Q90 140 180 148 T360 145 T540 152 T720 143 T900 150 T1080 146 T1260 153 T1440 147 V300 H0Z" fill="url(#grit)" />
      <path d="M0 150 Q90 140 180 148 T360 145 T540 152 T720 143 T900 150 T1080 146 T1260 153 T1440 147" fill="none" stroke="#2A1A10" stroke-width="1.5" vector-effect="non-scaling-stroke" />
      <!-- chalk -->
      <path d="M0 238 Q80 232 160 237 T320 235 T480 240 T640 233 T800 238 T960 234 T1120 240 T1280 235 T1440 238 V300 H0Z" fill="#ECE6D7" />
      <path d="M0 238 Q80 232 160 237 T320 235 T480 240 T640 233 T800 238 T960 234 T1120 240 T1280 235 T1440 238 V300 H0Z" fill="url(#flint)" />
      <path d="M0 238 Q80 232 160 237 T320 235 T480 240 T640 233 T800 238 T960 234 T1120 240 T1280 235 T1440 238" fill="none" stroke="#9C6A2A" stroke-width="1.5" vector-effect="non-scaling-stroke" />
    </svg>
    <span class="chip dark" style="top: 30%">Topsoil</span>
    <span class="chip light" style="top: 62%">Clay subsoil</span>
    <span class="chip light" style="top: 86%">Chalk</span>
    <div class="sprouts" id="sprouts"></div>
  </div>

  <script>
    // A row of seedlings on the ground line, each a little different. Deterministic.
    const row = document.getElementById('sprouts')
    const portrait = innerHeight > innerWidth
    const n = portrait ? 6 : 15
    let s = 7
    const r = () => ((s = (s * 16807) % 2147483647) / 2147483647)
    for (let i = 0; i < n; i++) {
      const x = ((i + 0.5) / n) * 100 + (r() - 0.5) * (portrait ? 6 : 3)
      const tall = 0.75 + r() * 0.6
      const lean = (r() - 0.5) * 12
      const leafA = ['#2F6B2A', '#4E8E35'][i % 2]
      const el = document.createElementNS('http://www.w3.org/2000/svg', 'svg')
      el.setAttribute('viewBox', '0 0 32 32')
      el.style.left = `calc(${x}% - 1.7vw)`
      el.style.transform = `scale(${tall}) rotate(${lean}deg)`
      el.innerHTML = `
        <path d="M16 31V15" stroke="#173D1F" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M16 17c-1-5-5.5-7.5-10-7 .3 4.6 4.4 7.6 10 7z" fill="${leafA}" stroke="#173D1F" stroke-width="1.4" stroke-linejoin="round"/>
        <path d="M16 15.5c.6-5.4 5-8.6 10.5-8.3-.2 5.2-4.6 8.6-10.5 8.3z" fill="#8DBF5A" stroke="#173D1F" stroke-width="1.4" stroke-linejoin="round"/>`
      row.appendChild(el)
    }
  </script>
</body>
</html>
